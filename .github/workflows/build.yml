name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/padvision.jks"
      - run: gradle assembleDebug --no-daemon
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/padvision.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: padvision
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: TvLauncher-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -o 'Version [0-9.]*' app/src/main/java/com/bensal/tvlauncher/MainActivity.kt | head -1 | sed 's/Version //')
          TAG="v${VER}-build${{ github.run_number }}"
          gh release create "$TAG" "app/build/outputs/apk/debug/app-debug.apk#PadVision.apk" \
            --title "PadVision ${VER} (build ${{ github.run_number }})" \
            --notes "Automatic build from commit ${{ github.sha }}" \
            --target "${{ github.sha }}"
